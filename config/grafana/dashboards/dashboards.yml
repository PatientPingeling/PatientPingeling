apiVersion: 1

providers:
  - name: "PatientPingeling Dashboards"
    orgId: 1
    folder: "PatientPingeling"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/definitions
      foldersFromFilesStructure: false
