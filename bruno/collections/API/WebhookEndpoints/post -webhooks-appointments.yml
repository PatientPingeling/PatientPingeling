info:
  name: POST /webhooks/appointments
  type: http
  seq: 1
  tags:
    - WebhookEndpoints

http:
  method: POST
  url: "{{baseUrl}}/webhooks/appointments"
  headers:
    - name: X-Tenant-Id
      value: "{{tenantId}}"
    - name: X-Webhook-Secret
      value: "{{webhookSecret}}"
  body:
    type: json
    data: |-
      {
        "action": "CREATED",
        "patient": {
          "externalId": "PP-0042",
          "givenName": "Jan",
          "email": "jan.devries@email.com",
          "phoneNumber": "+31612345678"
        },
        "appointment": {
          "externalId": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
          "scheduledAt": "2026-06-15T09:30:00+02:00",
          "service": "General Medicine",
          "location": "Cardiologie, Kamer B3",
          "instructions": "Neem uw vorige testresultaten mee"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
