info:
  name: webhook CANCELLED
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/webhooks/appointments"
  headers:
    - name: X-Tenant-Id
      value: "{{tenantId}}"
    - name: X-Webhook-Secret
      value: "{{webhookSecret}}"
  body:
    type: json
    data: |-
      {
        "action": "CANCELLED",
        "patient": {
          "externalId": "TEST-0001",
          "givenName": "Testpersoon",
          "email": "test@patientpingeling.nl",
          "phoneNumber": "+31600000001"
        },
        "appointment": {
          "externalId": "test-uuid-created-001",
          "scheduledAt": "2027-01-01T10:00:00+01:00",
          "service": "General Medicine",
          "location": "Kamer 1",
          "instructions": null
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests:
  - name: returns 201 Created
    script: |
      expect(res.status).to.equal(201);
  - name: action is CANCELLED
    script: |
      expect(res.body.action).to.equal('CANCELLED');
