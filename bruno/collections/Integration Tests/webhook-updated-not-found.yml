info:
  name: webhook UPDATED - appointment not found
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/webhooks/appointments"
  headers:
    - name: X-Tenant-Id
      value: "{{tenantId}}"
    - name: X-Api-Key
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "action": "UPDATED",
        "patient": {
          "externalId": "TEST-0001",
          "givenName": "Testpersoon",
          "email": "test@patientpingeling.nl",
          "phoneNumber": null
        },
        "appointment": {
          "externalId": "non-existing-uuid-9999",
          "scheduledAt": "2027-01-01T10:00:00+01:00",
          "service": "General Medicine",
          "location": "Kamer 1",
          "instructions": null
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests:
  - name: returns 404 Not Found
    script: |
      expect(res.status).to.equal(404);
