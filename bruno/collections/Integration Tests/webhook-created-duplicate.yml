info:
  name: webhook CREATED - duplicate (idempotent)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/webhooks/appointments"
  headers:
    - name: X-Tenant-Id
      value: "{{tenantId}}"
    - name: X-Api-Key
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "action": "CREATED",
        "patient": {
          "externalId": "TEST-0001",
          "givenName": "Testpersoon",
          "email": "test@patientpingeling.nl",
          "phoneNumber": "+31600000001"
        },
        "appointment": {
          "externalId": "test-uuid-created-001",
          "scheduledAt": "2027-01-01T10:00:00+01:00",
          "service": "General Medicine",
          "location": "Kamer 1",
          "instructions": null
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests:
  - name: returns 200 OK (idempotent skip)
    script: |
      expect(res.status).to.equal(200);
  - name: response says already exists
    script: |
      expect(res.body.message).to.equal('Appointment already exists.');
