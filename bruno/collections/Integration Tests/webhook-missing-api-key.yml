info:
  name: webhook - missing X-Api-Key header
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/webhooks/appointments"
  headers:
    - name: X-Tenant-Id
      value: "{{tenantId}}"
  body:
    type: json
    data: |-
      {
        "action": "CREATED",
        "patient": {
          "externalId": "TEST-0001",
          "givenName": "Testpersoon",
          "email": "test@patientpingeling.nl",
          "phoneNumber": null
        },
        "appointment": {
          "externalId": "test-uuid-missing-apikey",
          "scheduledAt": "2027-01-01T10:00:00+01:00",
          "service": "General Medicine",
          "location": "Kamer 1",
          "instructions": null
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

tests:
  - name: returns 400 Bad Request
    script: |
      expect(res.status).to.equal(400);
  - name: response mentions X-Api-Key
    script: |
      expect(res.body.detail).to.include('X-Api-Key');
