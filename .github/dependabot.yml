version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /tests
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget-dependencies:
        patterns:
          - "*"
