name: OpenMRS Plugin

on:
  push:
    branches: [main]
    paths:
      - "plugins/OpenMRS.PatientPingeling/**"
      - ".github/workflows/openmrs.yml"
  pull_request:
    branches: [main]
    paths:
      - "plugins/OpenMRS.PatientPingeling/**"
      - ".github/workflows/openmrs.yml"

concurrency:
  group: openmrs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_OPENMRS }}
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_PROJECT_KEY: PatientPingeling_openmrs

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: "temurin"
          cache: "maven"

      - name: Build & Test
        run: mvn verify --batch-mode
        working-directory: plugins/OpenMRS.PatientPingeling

      - name: Setup Java for SonarQube
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache SonarQube packages
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analyze with SonarQube
        if: ${{ env.SONAR_TOKEN != '' }}
        run: mvn --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.junit.reportPaths=api/target/surefire-reports,omod/target/surefire-reports -Dsonar.java.coveragePlugin=jacoco -Dsonar.coverage.jacoco.xmlReportPaths=api/target/site/jacoco/jacoco.xml,omod/target/site/jacoco/jacoco.xml
        working-directory: plugins/OpenMRS.PatientPingeling

      - name: Upload .omod artifact
        uses: actions/upload-artifact@v7
        with:
          name: patientpingeling-enricher.omod
          path: plugins/OpenMRS.PatientPingeling/omod/target/*.omod
