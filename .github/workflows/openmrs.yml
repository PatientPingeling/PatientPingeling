name: OpenMRS Plugin

on:
  push:
    branches: [main]
    paths:
      - "plugins/OpenMRS.PatientPingeling/**"
      - ".github/workflows/openmrs.yml"
  pull_request:
    branches: [main]
    paths:
      - "plugins/OpenMRS.PatientPingeling/**"
      - ".github/workflows/openmrs.yml"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"
          cache: "maven"

      - name: Build & Test
        run: mvn verify --batch-mode
        working-directory: plugins/OpenMRS.PatientPingeling

      - name: Upload .omod artifact
        uses: actions/upload-artifact@v4
        with:
          name: patientpingeling-enricher.omod
          path: plugins/OpenMRS.PatientPingeling/omod/target/*.omod
