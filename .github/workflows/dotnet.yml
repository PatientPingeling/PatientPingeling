name: .NET CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/dotnet.yml"

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_DOTNET }}
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_PROJECT_KEY: PatientPingeling_dotnet

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Setup Java for SonarQube
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache SonarQube packages
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube scanner
        if: ${{ env.SONAR_TOKEN != '' }}
        id: cache-sonar-scanner
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        if: ${{ env.SONAR_TOKEN != '' && steps.cache-sonar-scanner.outputs.cache-hit != 'true' }}
        run: dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"

      - name: Restore dependencies
        run: dotnet restore

      - name: Begin SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ${{ runner.temp }}/scanner/dotnet-sonarscanner begin /k:"$SONAR_PROJECT_KEY" /o:"patientpingeling" /d:sonar.host.url="$SONAR_HOST_URL" /d:sonar.token="$SONAR_TOKEN" /d:sonar.exclusions="**/bin/**,**/obj/**,docs/**,plugins/**,scripts/**,config/**,*.py,*.sql" /d:sonar.cs.cobertura.reportsPaths="coverage/unit-tests/coverage.cobertura.xml,coverage/arch-tests/coverage.cobertura.xml,coverage/integration-tests/coverage.cobertura.xml"

      - name: Build
        run: dotnet build --no-restore --configuration Release --no-incremental

      - name: Unit Tests
        run: dotnet test tests/NotificationService.UnitTests --no-build --configuration Release --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=./coverage/unit-tests/

      - name: Architecture Tests
        run: dotnet test tests/NotificationService.ArchTests --no-build --configuration Release --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=./coverage/arch-tests/

      - name: Integration Tests
        run: dotnet test tests/NotificationService.IntegrationTests --no-build --configuration Release --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=./coverage/integration-tests/

      - name: End SonarQube analysis
        if: ${{ always() && env.SONAR_TOKEN != '' }}
        run: ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
