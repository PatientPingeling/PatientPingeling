name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  test-dotnet:
    name: Test .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity normal

  test-openmrs:
    name: Test OpenMRS Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: "temurin"
          cache: "maven"

      - name: Test
        run: mvn verify --batch-mode
        working-directory: plugins/OpenMRS.PatientPingeling

  build-api:
    name: Build Notification API
    runs-on: ubuntu-latest
    needs: [test-dotnet]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Publish
        run: dotnet publish src/NotificationService.Api/NotificationService.Api.csproj --configuration Release --output ./publish/api

      - uses: actions/upload-artifact@v7
        with:
          name: notification-api
          path: ./publish/api

  build-scheduler:
    name: Build Scheduler
    runs-on: ubuntu-latest
    needs: [test-dotnet]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Publish
        run: dotnet publish src/NotificationService.Scheduler/NotificationService.Scheduler.csproj --configuration Release --output ./publish/scheduler

      - uses: actions/upload-artifact@v7
        with:
          name: scheduler
          path: ./publish/scheduler

  build-worker:
    name: Build Notification Worker
    runs-on: ubuntu-latest
    needs: [test-dotnet]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Publish
        run: dotnet publish src/NotificationService.Worker/NotificationService.Worker.csproj --configuration Release --output ./publish/worker

      - uses: actions/upload-artifact@v7
        with:
          name: notification-worker
          path: ./publish/worker

  build-openmrs:
    name: Build OpenMRS Plugin
    runs-on: ubuntu-latest
    needs: [test-openmrs]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: "temurin"
          cache: "maven"

      - name: Build
        run: mvn package --batch-mode -DskipTests
        working-directory: plugins/OpenMRS.PatientPingeling

      - uses: actions/upload-artifact@v7
        with:
          name: patientpingeling-enricher.omod
          path: plugins/OpenMRS.PatientPingeling/omod/target/*.omod

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-api, build-scheduler, build-worker, build-openmrs]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Zip artifacts
        run: |
          cd artifacts
          zip -r notification-api.zip notification-api/
          zip -r scheduler.zip scheduler/
          zip -r notification-worker.zip notification-worker/

      - name: Enforce pinned actions
        run: |
          # Ensure softprops/action-gh-release is referenced by full commit SHA (40 hex chars)
          line=$(grep -n "uses: softprops/action-gh-release@" ../.github/workflows/release.yml || true)
          if [ -z "$line" ]; then
            echo "No reference to softprops/action-gh-release found in workflow file; skipping pin check.";
          else
            ref=$(echo "$line" | sed -E 's/.*uses: softprops\/action-gh-release@(.+)$/\1/')
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "ERROR: softprops/action-gh-release is not pinned to a full 40-char commit SHA. Found: '$ref'";
              echo "Please update .github/workflows/release.yml to use the full commit SHA for the action (example: uses: softprops/action-gh-release@0123456789abcdef...)")
              exit 1;
            fi
            echo "softprops/action-gh-release is pinned: $ref";
          fi

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: PatientPingeling ${{ github.event.inputs.version }}
          generate_release_notes: true
          files: |
            artifacts/notification-api.zip
            artifacts/scheduler.zip
            artifacts/notification-worker.zip
            artifacts/patientpingeling-enricher.omod/*.omod
