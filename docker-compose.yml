# ==========================================
# External Services
# ==========================================
  messageproviders:
    image: ghcr.io/avansict/in2.4-fakecomworld:main
    ports:
      - "1337:8080"
    restart: unless-stopped

# ==========================================
# INFRASTRUCTURE
# ==========================================
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ==========================================
# OPENMRS STACK (The Source of Truth)
# ==========================================
  openmrs-gateway:
    image: openmrs/openmrs-reference-application-3-gateway:${OPENMRS_TAG:-qa}
    ports:
      - "80:80"
    depends_on:
      - openmrs-frontend
      - openmrs-backend
    restart: unless-stopped

  openmrs-frontend:
    image: openmrs/openmrs-reference-application-3-frontend:${OPENMRS_TAG:-qa}
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json
      SPA_DEFAULT_LOCALE:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
    depends_on:
      - openmrs-backend
    restart: unless-stopped

  openmrs-backend:
    image: openmrs/openmrs-reference-application-3-backend:${OPENMRS_TAG:-qa}
    depends_on:
      openmrs-db:
        condition: service_healthy
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: openmrs-db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs"]
      timeout: 5s
    volumes:
      - openmrs-data:/openmrs/data
      # Mount the built plugin into OpenMRS modules folder
      - ./plugins/OpenMRS.PatientPingeling/omod/target/patientpingeling.enricher-1.0.0-SNAPSHOT.omod:/openmrs/data/modules/patientpingeling.enricher.omod
    restart: unless-stopped

  openmrs-db:
    image: mariadb:10.11.7
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
    healthcheck:
      test: "mysql --user=${OMRS_DB_USER:-openmrs} --password=${OMRS_DB_PASSWORD:-openmrs} --execute \"SHOW DATABASES;\""
      interval: 3s
      timeout: 1s
      retries: 5
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  openmrs-data:
  db-data: