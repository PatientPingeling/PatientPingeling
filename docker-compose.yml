# ---- Port Overview ----
# | Service        | Host Port |
# |----------------|-----------|
# | .NET API       | 8000      |
# | FakeComWorld   | 1337      |
# | OpenMRS        | 80        |
# | RabbitMQ       | 5672      |
# | RabbitMQ UI    | 15672     |
# | Postgres       | 5432      |
# | Grafana UI     | 3000      |

services:
# ==========================================
# .NET NOTIFICATION SERVICE STACK
# ==========================================
  api:
    build:
      context: ./src
      dockerfile: NotificationService.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8000
      - ConnectionStrings__Postgres=Host=${POSTGRES_HOST};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__Host=${RABBITMQ_HOST}
      - RabbitMQ__Username=${RABBITMQ_USERNAME}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Security__EncryptionKey=${ENCRYPTION_KEY}
      - Providers__BaseUrl=http://messageproviders:8080
      - Providers__StudentGroup=${STUDENT_GROUP:-PatientPingeling}
      - OpenTelemetry__Endpoint=http://otel-lgtm:4317
      - OpenTelemetry__Environment=${ASPNETCORE_ENVIRONMENT:-Production}
    depends_on:
      postgres:
        condition: service_healthy
      # otel-lgtm:
      #   condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  scheduler:
    build:
      context: ./src
      dockerfile: NotificationService.Scheduler/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__Postgres=Host=${POSTGRES_HOST};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__Host=${RABBITMQ_HOST}
      - RabbitMQ__Username=${RABBITMQ_USERNAME}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Security__EncryptionKey=${ENCRYPTION_KEY}
      - OpenTelemetry__Endpoint=http://otel-lgtm:4317
      - OpenTelemetry__Environment=${ASPNETCORE_ENVIRONMENT:-Production}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ./src
      dockerfile: NotificationService.Worker/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__Postgres=Host=${POSTGRES_HOST};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__Host=${RABBITMQ_HOST}
      - RabbitMQ__Username=${RABBITMQ_USERNAME}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Security__EncryptionKey=${ENCRYPTION_KEY}
      - OpenTelemetry__Endpoint=http://otel-lgtm:4317
      - OpenTelemetry__Environment=${ASPNETCORE_ENVIRONMENT:-Production}
      - Providers__BaseUrl=http://messageproviders:8080
      - Providers__StudentGroup=${STUDENT_GROUP:-PatientPingeling}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
      messageproviders:
        condition: service_started
    restart: unless-stopped

# ==========================================
# External Services
# ==========================================
  messageproviders:
    image: ghcr.io/avansict/in2.4-fakecomworld:main
    environment:
      - SwiftSend__ApiKey=swiftsend-api-key
      - SecurePost__ClientId=securepost-client-id
      - SecurePost__ClientSecret=securepost-secret-key
      - AsyncFlow__ApiKey=asyncflow-api-key
      - LegacyLink__Username=legacylink-user
      - LegacyLink__Password=legacylink-password
      - AsyncFlow__FailureRatePercentage=${ASYNCFLOW_FAILURE_RATE:-50}
      - SecurePost__FaultInjectionRatePercentage=${SECUREPOST_FAULT_RATE:-50}
      - SwiftSend__FaultInjectionRatePercentage=${SWIFTSEND_FAULT_RATE:-50}
    ports:
      - "1337:8080"
    restart: unless-stopped

# ==========================================
# INFRASTRUCTURE
# ==========================================
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"     # Grafana UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ==========================================
# OPENMRS STACK (The Source of Truth)
# ==========================================
  openmrs-gateway:
    image: openmrs/openmrs-reference-application-3-gateway:${OPENMRS_TAG:-qa}
    ports:
      - "80:80"
    depends_on:
      - openmrs-frontend
      - openmrs-backend
    restart: unless-stopped

  openmrs-frontend:
    image: openmrs/openmrs-reference-application-3-frontend:${OPENMRS_TAG:-qa}
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json
      SPA_DEFAULT_LOCALE:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
    depends_on:
      - openmrs-backend
    networks:
      default:
        aliases:
          - frontend
    restart: unless-stopped

  openmrs-backend:
    image: openmrs/openmrs-reference-application-3-backend:${OPENMRS_TAG:-qa}
    networks:
      default:
        aliases:
          - backend
    depends_on:
      openmrs-db:
        condition: service_healthy
      omod-installer:
        condition: service_completed_successfully
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: openmrs-db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      # --- PATIENT PINGELING SECRETS ---
      PP_API_KEY: ${PP_API_KEY}
      PP_TENANT_KEY: ${PP_TENANT_KEY}
      PP_WEBHOOK_URL: ${PP_WEBHOOK_URL:-http://api:8000/webhooks/appointments}
      PP_SECRETS_FILE: ${PP_SECRETS_FILE:-}
      PP_SERVICE_USER: ${PP_SERVICE_USER}
      PP_SERVICE_PASSWORD: ${PP_SERVICE_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs"]
      timeout: 5s
    volumes:
      - openmrs-data:/openmrs/data
    restart: unless-stopped

  omod-installer:
    image: alpine
    volumes:
      - ./plugins/OpenMRS.PatientPingeling/omod/target/patientpingeling.enricher-1.0.0-SNAPSHOT.omod:/input/patientpingeling.enricher.omod:ro
      - openmrs-data:/openmrs/data
    command: sh -c "cp /input/patientpingeling.enricher.omod /openmrs/data/modules/patientpingeling.enricher.omod && chmod 644 /openmrs/data/modules/patientpingeling.enricher.omod"

  openmrs-db:
    image: mariadb:10.11.7
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
    healthcheck:
      test: "mysql --user=${OMRS_DB_USER:-openmrs} --password=${OMRS_DB_PASSWORD:-openmrs} --execute \"SHOW DATABASES;\""
      interval: 3s
      timeout: 1s
      retries: 5
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  openmrs-data:
  db-data: