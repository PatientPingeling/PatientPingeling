# ---- Port Overview ----
# | Service        | Host Port |
# |----------------|-----------|
# | .NET API       | 8000      |
# | FakeComWorld   | 1337      |
# | OpenMRS        | 8080      |
# | RabbitMQ       | 5672      |
# | RabbitMQ UI    | 15672     |
# | Postgres       | 5432      |
# | OpenMRS DB     | 3306      |

services:
  # ==========================================
  # .NET NOTIFICATION SERVICE STACK
  # ==========================================
  api:
    build:
      context: ./src
      dockerfile: ./src/NotificationService.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8000
      - RabbitMQ__Host=${RABBITMQ_HOST}
      - RabbitMQ__Username=${RABBITMQ_USERNAME}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  listener:
    build:
      context: ./src
      dockerfile: ./src/NotificationService.Listener/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__Postgres=Host=${POSTGRES_HOST};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__Host=${RABBITMQ_HOST}
      - RabbitMQ__Username=${RABBITMQ_USERNAME}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./src
      dockerfile: ./src/NotificationService.Worker/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__Postgres=Host=${POSTGRES_HOST};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # External Services
  # ==========================================
  messageproviders:
    image: ghcr.io/avansict/in2.4-fakecomworld:main
    ports:
      - "1337:8080"
    restart: unless-stopped

  # ==========================================
  # INFRASTRUCTURE
  # ==========================================
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # OPENMRS STACK (The Source of Truth)
  # ==========================================
  openmrs:
    image: openmrs/openmrs-reference-application-3-backend:latest
    ports:
      - "8080:8080"
    depends_on:
      openmrs-db:
        condition: service_healthy
    volumes:
      # Mounts your custom plugin into OpenMRS
      - ../openmrs-notification-plugin/omod/target/event-enricher-1.0.0.omod:/openmrs/distribution/openmrs_modules/event-enricher.omod
    environment:
      - DB_DATABASE=${OMRS_DB_NAME}
      - DB_HOST=openmrs-db
      - DB_USERNAME=${OMRS_DB_USER}
      - DB_PASSWORD=${OMRS_DB_PASS}
    restart: unless-stopped

  openmrs-db:
    image: mariadb:10.6
    environment:
      MYSQL_DATABASE: ${OMRS_DB_NAME}
      MYSQL_USER: ${OMRS_DB_USER}
      MYSQL_PASSWORD: ${OMRS_DB_PASS}
      MYSQL_ROOT_PASSWORD: ${OMRS_ROOT_PASS}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - openmrs_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  openmrs_data: